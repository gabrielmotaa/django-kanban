<div class="column" role="group" aria-label="{{ column.title }}" data-column-id="{{ column.pk }}" x-data="{ editingTitle: false, menuOpen: false }" style="--column-color: {{ column.color|default:'#64748b' }}; --column-fg: {{ column.fg_color }};">
    {% include "kanban/templates/_column_header.html" %}
  
    <div class="column__body">
        <div class="column__cards" id="column-{{ column.pk }}-cards">
            {% for card in column.cards.all %}
                {% include "kanban/templates/_card.html" %}
            {% endfor %}
        </div>

        {# Add card section #}
        <div x-data="{ adding: false }">
            <button x-show="!adding" 
                    @click="adding = true; $nextTick(() => $refs.cardInput.focus())" 
                    class="column__add-card-trigger"
            >
                + Adicionar card
            </button>
            <form 
                x-show="adding" 
                x-cloak 
                hx-post="{% url 'card_create' %}" 
                hx-target="#column-{{ column.pk }}-cards" 
                hx-swap="beforeend" 
                @htmx:after-request="if ($event.detail.successful) { adding = false; $el.reset() }"
                class="column__add-card-form"
            >
                {% csrf_token %}
                <input type="hidden" name="column_id" value="{{ column.pk }}">
                <input 
                    x-ref="cardInput"
                    type="text" 
                    name="title" 
                    placeholder="Título do card..." 
                    aria-label="Título do card"
                    required 
                    class="column__add-card-input"
                    maxlength="200"
                    @keydown.escape="adding = false"
                >
                <div class="column__add-card-actions">
                    <button type="button" @click="adding = false" class="column__add-card-cancel">Cancelar</button>
                    <button type="submit" class="column__add-card-submit">Adicionar</button>
                </div>
            </form>
        </div>
    </div>
</div>
