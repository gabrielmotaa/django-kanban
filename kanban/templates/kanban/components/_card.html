<kanban-card id="card-{{ card.pk }}" card-id="{{ card.pk }}" order="{{ card.order }}" href="{% url 'card_detail' card.pk %}" dialog-href="{% url 'card_dialog' card.pk %}" labels="{% for label in card.labels.all %}{{ label.pk }}{% if not forloop.last %},{% endif %}{% endfor %}"{% if card.description %} has-description{% endif %}{% if card.due_date %} due="{{ card.due_date|date:"d/m" }}" due-status="{{ card.due_status }}" due-label="{{ card.due_label }}"{% endif %}{% if card.completed %} completed{% endif %}>{{ card.title }}</kanban-card>
