{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Kanban{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{% static 'kanban/css/reset.css' %}">
    <link rel="stylesheet" href="{% static 'kanban/css/theme.css' %}">
    {% block extra_css %}{% endblock %}
    <script src="{% static 'kanban/js/htmx.min.js' %}" defer></script>
    {% block extra_head %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}
    <script>
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });
        document.body.addEventListener('htmx:beforeSwap', (event) => {
            const xhr = event.detail.xhr;
            if (xhr.status === 204) {
                event.detail.shouldSwap = true;
            }
            // Error responses that carry a toast (see kanban.utils.error_response)
            // are swapped into the toast area; they still count as errors.
            if (xhr.status >= 400 && xhr.getResponseHeader('X-Toast')) {
                const toastArea = document.getElementById('toast-area');
                event.detail.shouldSwap = !!toastArea;
                if (toastArea) event.detail.target = toastArea;
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
