[project]
name = "django-kanban"
version = "0.1.0"
description = "A simple kanban board application built with Django."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6",
]

[dependency-groups]
dev = [
    "playwright>=1.60.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11.1",
    "pytest-playwright>=0.8.0",
    "ruff>=0.15.16",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
markers = [
    "integration: marks tests as integration/browser tests (run with -m integration)"
]
addopts = "-m 'not integration'"
