[project]
name = "django-kanban"
version = "0.1.0"
description = "A simple kanban board application built with Django."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.11.1",
    "ruff>=0.15.16",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
